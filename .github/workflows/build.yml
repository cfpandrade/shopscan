name: Build & Push Addon Image

on:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
          - arch: aarch64
            platform: linux/arm64
          - arch: armv7
            platform: linux/arm/v7

    steps:
      - name: Checkout
        uses: actions/checkout@v4.2.2

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3.6.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3.10.0

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3.4.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Get addon version
        id: version
        run: |
          VERSION=$(grep '^version:' shopscan/config.yaml | sed 's/version: *"//' | sed 's/"//')
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Building version $VERSION for ${{ matrix.arch }}"

      - name: Build and push
        uses: docker/build-push-action@v6.16.0
        with:
          context: ./shopscan
          platforms: ${{ matrix.platform }}
          push: true
          build-args: |
            BUILD_FROM=node:20-alpine
          tags: |
            ghcr.io/${{ github.repository_owner }}/shopscan/${{ matrix.arch }}:${{ steps.version.outputs.version }}
            ghcr.io/${{ github.repository_owner }}/shopscan/${{ matrix.arch }}:latest
